# =============================================================================
# Domain: recruitment
# Entity: JobApplication
# Description: A candidate's application against a requisition — the central
#              funnel object. The lifecycle is STAGE-DRIVEN: stage_id points at
#              a configurable RecruitmentStage (lifecycle: stage_ref) and there
#              is deliberately NO stored status enum — the pipeline is company
#              config, so any hardcoded state list would fight it. Where an
#              application "is" derives from the stage flags plus the refusal
#              marks: hired = its stage is_hired, refused = refused_at set,
#              ongoing = anything else. Transition rules (which moves are
#              legal, and the vacancy coupling into the requisition) live in
#              the application write service, the one door for stage changes.
# =============================================================================

models:
  - name: JobApplication
    collection: job_applications
    description: "A candidate's application to a requisition (central funnel object; stage-driven lifecycle)."

    relations:
      stage:
        type: RecruitmentStage

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique application id"

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning company # logical FK organization.Company.id"

      candidate_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Candidate.id)"]
        description: "Applicant # FK candidates.id (in-module)"

      requisition_id:
        type: uuid
        attributes: ["@required", "@foreign_key(JobRequisition.id)"]
        description: "Requisition applied to # FK job_requisitions.id (in-module)"

      stage_id:
        type: uuid
        attributes: ["@required", "@foreign_key(RecruitmentStage.id)"]
        lifecycle: stage_ref
        description: "Current pipeline stage # FK recruitment_stages.id (in-module, stage_ref lifecycle)"

      last_stage_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Previous stage # FK recruitment_stages.id — kept for funnel-fall-off analysis"

      stage_updated_at:
        type: datetime?
        description: "When the application last changed stage — feeds staleness/rotting views"

      date_closed:
        type: datetime?
        description: "When the application closed (hired or refused); null while ongoing"

      refuse_reason:
        type: string?
        attributes: ["@length(max=500)"]
        description: "Why the application was refused (sticky — set once)"

      refused_at:
        type: datetime?
        description: "When it was refused; non-null IS the refused mark"

      applied_at:
        type: datetime
        attributes: ["@required", "@default(now)"]
        description: "Application timestamp"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    indexes:
      - type: index
        fields: [company_id, stage_id]
      - type: index
        fields: [candidate_id]
      - type: index
        fields: [requisition_id]
