# =============================================================================
# recruitment Module - Schema Index
# =============================================================================
# Version: 3.0
# Description: Module schema index. `module:` and `schema:` are stamped from the
# module name by `metaphor module create`. `schema:` gives this module its OWN
# Postgres schema (migrations emit `CREATE SCHEMA recruitment` and qualify tables
# as `recruitment.<table>`) — the convention every backbone module follows
# (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: recruitment
version: 3
schema: recruitment

# Company fence: talent acquisition records (candidates, applications, offers,
# requisitions, interviews, stages, skill requirements, letter templates) are
# company-private — every table carries company_id and row access is enforced
# by the strict fence policies (ADR-0014 vocabulary).
company_fence: strict
description: "recruitment / applicant tracking (requisition -> candidate -> offer -> hire)"

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model. The 8 real entities.
imports:
  - job_requisition.model.yaml
  - requisition_skill.model.yaml
  - recruitment_stage.model.yaml
  - candidate.model.yaml
  - job_application.model.yaml
  - interview.model.yaml
  - job_offer.model.yaml
  - offer_letter_template.model.yaml
