server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/recruitment.log
module:
  name: recruitment
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  candidate:
    collection: candidates
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  interview:
    collection: interviews
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  job_application:
    collection: job_applications
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  job_offer:
    collection: job_offers
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  job_requisition:
    collection: job_requisitions
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
