# Codegen policy for recruitment.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Hand-written files the audit found undeclared; declared so a schema
  # regeneration cannot delete them.
  - "src/domain/entity/application_status.rs"

  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"
  # ADR-005 producer: hire() emits recruitment.hired outbox event in-tx with the offer acceptance.
  - "src/application/service/job_offer_write_service.rs"
  # Stage-driven application transitions (move_stage / refuse / create) — the one
  # door for stage changes; owns the requisition vacancy coupling.
  - "src/application/service/job_application_write_service.rs"
  # Interview scheduling verbs + the interviewer-notification activity port.
  - "src/application/service/interview_write_service.rs"
  # Requisition skill requirements (set/replace) with cross-schema skill validation.
  - "src/application/service/requisition_skill_write_service.rs"
  # The vacancy rule (openings = headcount − filled) the application and offer
  # verbs refuse on when a requisition is full.
  - "src/application/service/requisition_vacancy.rs"
  # The approvals-engine seam for requisition opening and offer extension, and
  # the engine-gated draft → open requisition lane.
  - "src/application/service/recruitment_approvals_port.rs"
  - "src/application/service/requisition_lifecycle.rs"
  # Binds the composer's request pool for the verbs.
  - "src/request_pool.rs"
  # Outbound seams kept as local port traits so this module never depends on the
  # mail module: the host app wires real adapters; defaults fail closed.
  - "src/application/service/activity_port.rs"
  - "src/application/service/letter_port.rs"
  # {{placeholder}} renderer for offer-letter bodies (mail has no template engine).
  - "src/application/service/offer_letter_render.rs"
  # Org-authenticated HTTP surface (verbs + guarded CRUD).
  - "src/presentation/http/guarded_routes.rs"

  # Hand-written migrations that reshape published tables (append-only; the
  # generator only emits create-table files for new entities).
  - "migrations/20260817120000_stage_ref_reshape.up.sql"
  - "migrations/20260817120000_stage_ref_reshape.down.sql"
  # Tenancy strip: removes the company-fence artifacts (company-leading indexes,
  # <table>_company_isolation RLS policies, the company_id column) behind a
  # decorator-first ordering guard.
  - "migrations/20260909120000_strip_tenancy.up.sql"
  - "migrations/20260909120000_strip_tenancy.down.sql"
  # Column additions on published tables (append-only ALTERs).
  - "migrations/20260925140000_add_offer_approval_link.up.sql"
  - "migrations/20260925140000_add_offer_approval_link.down.sql"
  - "migrations/20260925160000_add_requisition_approval_link.up.sql"
  - "migrations/20260925160000_add_requisition_approval_link.down.sql"
  - "migrations/20261003120000_add_offer_start_date.up.sql"
  - "migrations/20261003120000_add_offer_start_date.down.sql"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  - "tests/hire_flow.rs"
  - "tests/vacancy_and_start_date.rs"
  - "tests/approval_link_read_shape.rs"

  # Hand-authored module documentation.
  - "docs/**"
